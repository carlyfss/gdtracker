openapi: 3.0.3
info:
  title: GDTracker Go API
  version: 0.5.0
  description: |
    Go backend for GDTracker. Supports two auth modes via `AUTH_MODE` (see `docs/AUTH.md`):
    **session** (default) — cookie `JSESSIONID` + CSRF; **auth0** — `Authorization: Bearer` access token validated via JWKS.
    Routes mirror `gdtracker-api` for games, categories, tags, tasks, features, game configuration, archives, game exceptions,
    ingest plane (players, integration ping), game events (definitions + ingest), traces (heatmap), feedback, and planning nodes.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
    description: Session register/login/logout/CSRF (AUTH_MODE=session) or Bearer /auth/me (AUTH_MODE=auth0).
  - name: Health
    description: Liveness and readiness.
  - name: Games
    description: Game listing, creation, ingest token (session).
  - name: Categories
    description: Per-game categories (session).
  - name: Tags
    description: Per-game tags (session).
  - name: Tasks
    description: Per-game tasks (session).
  - name: Features
    description: Per-game product features and task progress (session).
  - name: Configuration
    description: Per-game feature flags, settings, exception task template (session).
  - name: GameExceptions
    description: Exceptions, search, ingest (Bearer + X-Player-Id for ingest).
  - name: IngestPlane
    description: Player registration and integration ping (Bearer ingest token).
  - name: GameEvents
    description: Event definitions CRUD, event listing/search, event ingest (Bearer + X-Player-Id for ingest).
  - name: GameTrace
    description: Heatmap / trace listing and ingest (Bearer + X-Player-Id for ingest).
  - name: GameFeedback
    description: Feedback meter definitions, feedback list/detail, feedback ingest (Bearer + X-Player-Id for ingest).
  - name: Planning
    description: Per-game planning documents (folders, markdown, Excalidraw JSON) (session).
paths:
  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
  /readyz:
    get:
      tags: [Health]
      operationId: getReadyz
      summary: Readiness (Postgres ping when DB configured)
      responses:
        "200":
          description: Database reachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthzResponse"
        "503":
          description: No database or ping failed
  /api/csrf:
    get:
      tags: [Auth]
      operationId: getCsrf
      summary: Return CSRF token JSON and set XSRF-TOKEN cookie
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: postAuthRegister
      summary: Register and establish session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRegisterRequest"
      responses:
        "201":
          description: Created; JSESSIONID and XSRF-TOKEN cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error (text/plain)
        "409":
          description: Username already exists (text/plain)
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: postAuthLogin
      summary: Login and establish session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLoginRequest"
      responses:
        "200":
          description: OK; cookies set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
        "401":
          description: Invalid credentials
  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: postAuthLogout
      summary: Clear session (requires session + CSRF header on mutating requests)
      responses:
        "204":
          description: No content
        "401":
          description: Not authenticated
  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getAuthMe
      summary: Current user (401 if anonymous)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Not authenticated (empty body)
  /api/games:
    get:
      tags: [Games]
      operationId: listGames
      summary: List games for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameSummary"
        "401":
          description: Not authenticated
    post:
      tags: [Games]
      operationId: createGame
      summary: Create a game (bootstrap configuration + default category)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGameRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSummary"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
  /api/games/{gameId}/ingest-token:
    get:
      tags: [Games]
      operationId: getIngestTokenStatus
      summary: Ingest token configured flag and created-at
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTokenStatus"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
  /api/games/{gameId}/ingest-token/regenerate:
    post:
      tags: [Games]
      operationId: regenerateIngestToken
      summary: Regenerate ingest token (plaintext returned once)
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestTokenRegenerateResponse"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
  /api/games/{gameId}/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
    post:
      tags: [Categories]
      operationId: createCategory
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpsertRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
        "409":
          description: Duplicate category name
  /api/games/{gameId}/categories/{id}:
    put:
      tags: [Categories]
      operationId: updateCategory
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/CategoryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpsertRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Category or game not found
        "409":
          description: Duplicate name or category in use
    delete:
      tags: [Categories]
      operationId: deleteCategory
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "404":
          description: Category not found
        "409":
          description: Category has tasks or is in use
  /api/games/{gameId}/tags:
    get:
      tags: [Tags]
      operationId: listTags
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
    post:
      tags: [Tags]
      operationId: createTag
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpsertRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
        "409":
          description: Duplicate tag name
  /api/games/{gameId}/tags/{id}:
    put:
      tags: [Tags]
      operationId: updateTag
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/TagId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUpsertRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Tag not found
        "409":
          description: Duplicate name or tag in use
    delete:
      tags: [Tags]
      operationId: deleteTag
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/TagId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "404":
          description: Tag not found
        "409":
          description: Tag in use
  /api/games/{gameId}/tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks with optional filters (Spring parity)
      parameters:
        - $ref: "#/components/parameters/GameId"
        - name: featureId
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: string }
        - name: sourceGameExceptionId
          in: query
          schema: { type: string }
        - name: tagIds
          in: query
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: tagMode
          in: query
          schema: { type: string, enum: [ANY, ALL], default: ANY }
        - name: archivedOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
    post:
      tags: [Tasks]
      operationId: createTask
      description: |
        Creates a task. When `parentTaskId` is set, ancestor tasks with subtasks may have their status
        adjusted to the minimum status among their non-archived direct children.
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpsertRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
  /api/games/{gameId}/tasks/{id}:
    put:
      tags: [Tasks]
      operationId: updateTask
      description: |
        Updates a task. Tasks with non-archived subtasks ignore a higher requested status; the stored status
        is set to the minimum subtask status. Ancestor tasks may be adjusted the same way when this task's
        status or `parentTaskId` changes.
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpsertRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Task not found
    delete:
      tags: [Tasks]
      operationId: deleteTask
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/TaskId"
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
        "404":
          description: Task not found
  /api/games/{gameId}/tasks/{id}/archive:
    post:
      tags: [Tasks]
      operationId: archiveTask
      summary: Archive task subtree
      description: Archives this task and every descendant task in the same game (via parent_task_id). Idempotent when the root task is already archived.
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/TaskId"
        - name: includeSummary
          in: query
          description: When true, returns JSON summary instead of 204 (Go extension; default Spring-compatible 204).
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Optional summary when includeSummary=true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "204":
          description: No content
        "401":
          description: Not authenticated
        "404":
          description: Task not found
  /api/games/{gameId}/tasks/{id}/unarchive:
    post:
      tags: [Tasks]
      operationId: unarchiveTask
      summary: Unarchive task subtree
      description: When the task's feature is not archived, clears archive state for this task and all its descendant tasks in the same game. Other response branches apply when the feature is archived (restore flow).
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/TaskId"
        - name: includeSummary
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Optional summary when includeSummary=true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "204":
          description: No content
        "401":
          description: Not authenticated
        "404":
          description: Task not found
        "409":
          description: Archived feature metadata missing
  /api/games/{gameId}/features:
    get:
      tags: [Features]
      operationId: listFeatures
      parameters:
        - $ref: "#/components/parameters/GameId"
        - name: archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Feature" }
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
    post:
      tags: [Features]
      operationId: createFeature
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureUpsertRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { description: Validation error }
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
        "409": { description: Duplicate feature name }
  /api/games/{gameId}/features/task-progress:
    get:
      tags: [Features]
      operationId: listFeatureTaskProgress
      parameters:
        - $ref: "#/components/parameters/GameId"
        - name: archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeatureTaskProgressRow" }
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
  /api/games/{gameId}/features/{id}:
    put:
      tags: [Features]
      operationId: updateFeature
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/FeatureId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeatureUpsertRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Feature" }
        "400": { description: Validation error }
        "401": { description: Not authenticated }
        "404": { description: Feature not found }
        "409": { description: Conflict (archived feature or duplicate name) }
    delete:
      tags: [Features]
      operationId: deleteFeature
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/FeatureId"
      responses:
        "204": { description: Deleted }
        "401": { description: Not authenticated }
        "404": { description: Feature not found }
        "409": { description: Has subfeatures or tasks }
  /api/games/{gameId}/features/{id}/archive:
    post:
      tags: [Features]
      operationId: archiveFeature
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/FeatureId"
        - name: includeSummary
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Summary when includeSummary=true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "204": { description: No content }
        "401": { description: Not authenticated }
        "404": { description: Feature not found }
  /api/games/{gameId}/features/{id}/unarchive:
    post:
      tags: [Features]
      operationId: unarchiveFeature
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/FeatureId"
        - name: includeSummary
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Summary when includeSummary=true
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "204": { description: No content }
        "401": { description: Not authenticated }
        "404": { description: Feature not found }
  /api/games/{gameId}/configuration:
    get:
      tags: [Configuration]
      operationId: getGameConfiguration
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK (bootstraps row if missing)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameConfiguration" }
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
    patch:
      tags: [Configuration]
      operationId: patchGameConfiguration
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameConfigurationPatchRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameConfiguration" }
        "400": { description: Validation error }
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
  /api/games/{gameId}/game-exceptions:
    get:
      tags: [GameExceptions]
      operationId: listGameExceptions
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameException"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
    post:
      tags: [GameExceptions]
      operationId: reportGameException
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameExceptionReportRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameException"
        "400":
          description: Validation error
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
  /api/games/{gameId}/game-exceptions/interval:
    get:
      tags: [GameExceptions]
      operationId: listGameExceptionsInterval
      parameters:
        - $ref: "#/components/parameters/GameId"
        - name: fromMs
          in: query
          required: true
          schema: { type: integer, format: int64 }
        - name: toMs
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GameException"
        "400":
          description: fromMs must be less than toMs
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
  /api/games/{gameId}/game-exceptions/search:
    get:
      tags: [GameExceptions]
      operationId: searchGameExceptions
      parameters:
        - $ref: "#/components/parameters/GameId"
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        "200":
          description: Spring-style page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameExceptionPage"
        "401":
          description: Not authenticated
        "404":
          description: Game not found or not owned
  /api/games/{gameId}/game-exceptions/{exceptionId}:
    get:
      tags: [GameExceptions]
      operationId: getGameException
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/ExceptionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameException"
        "401":
          description: Not authenticated
        "404":
          description: Not found
  /api/games/{gameId}/game-exceptions/{exceptionId}/reserve-task-index:
    post:
      tags: [GameExceptions]
      operationId: reserveExceptionTaskIndex
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/ExceptionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [index]
                properties:
                  index: { type: integer }
        "401":
          description: Not authenticated
        "404":
          description: Exception or game not found
  /api/games/{gameId}/game-exceptions/ingest:
    post:
      tags: [GameExceptions]
      operationId: ingestGameException
      summary: Ingest from Godot (Bearer ingest token + X-Player-Id)
      security: []
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameExceptionIngestRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameException"
        "400":
          description: Invalid JSON
        "401":
          description: Missing/invalid token or player id
        "404":
          description: Game not found
  /api/games/{gameId}/game-players:
    post:
      tags: [IngestPlane]
      operationId: registerGamePlayer
      summary: Register a player for ingest (Bearer ingest token only)
      security: []
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [playerId]
                properties:
                  playerId: { type: string }
        "401": { description: Invalid token }
        "404": { description: Game not found }
  /api/games/{gameId}/integration:
    post:
