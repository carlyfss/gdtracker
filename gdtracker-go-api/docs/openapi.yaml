  /api/games/{gameId}/planning-nodes:
    get:
      tags: [Planning]
      operationId: listPlanningNodes
      summary: List planning nodes (metadata only, flat)
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanningNodeMeta"
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
    post:
      tags: [Planning]
      operationId: createPlanningNode
      summary: Create folder, markdown, or excalidraw node
      parameters:
        - $ref: "#/components/parameters/GameId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningNodeCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningNodeDetail"
        "400": { description: Validation error }
        "401": { description: Not authenticated }
        "404": { description: Game not found or not owned }
        "409": { description: Duplicate name in folder }
  /api/games/{gameId}/planning-nodes/{id}:
    get:
      tags: [Planning]
      operationId: getPlanningNode
      summary: Get planning node including body/scene
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/PlanningNodeId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningNodeDetail"
        "401": { description: Not authenticated }
        "404": { description: Node or game not found }
    put:
      tags: [Planning]
      operationId: updatePlanningNode
      summary: Partial update (name, parentId, sortOrder, markdownBody, excalidrawScene)
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/PlanningNodeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanningNodeUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanningNodeDetail"
        "400": { description: Validation error }
        "401": { description: Not authenticated }
        "404": { description: Node not found }
        "409": { description: Duplicate name in folder }
    delete:
      tags: [Planning]
      operationId: deletePlanningNode
      summary: Delete node (cascades to children per DB FK)
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/PlanningNodeId"
      responses:
        "204": { description: Deleted }
        "401": { description: Not authenticated }
        "404": { description: Node not found }
components:
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string }
    CategoryId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TagId:
      name: id
      in: path
      required: true
      schema: { type: string }
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FeatureId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string }
    EventDefinitionId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FeedbackMeterId:
      name: id
      in: path
      required: true
      schema: { type: string }
    FeedbackId:
      name: feedbackId
      in: path
      required: true
      schema: { type: string }
    PlanningNodeId:
      name: id
      in: path
      required: true
      schema: { type: string }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
    csrfHeader:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ingest-token
    auth0Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Auth0 access token (AUTH_MODE=auth0 dashboard routes).
  schemas:
    HealthzResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
      required:
        - status
    AuthLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    AuthRegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    UserResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        username:
          type: string
      required:
        - id
        - username
    GameSummary:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    CreateGameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
    IngestTokenStatus:
      type: object
      properties:
        configured: { type: boolean }
        createdAt: { type: string, nullable: true, format: date-time }
    IngestTokenRegenerateResponse:
      type: object
      required: [token]
      properties:
        token: { type: string }
        createdAt: { type: string, nullable: true, format: date-time }
    Category:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
    CategoryUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string }
    Tag:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
        description: { type: string, nullable: true }
    TagUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        color: { type: string }
        description: { type: string, nullable: true }
    Feature:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        color: { type: string }
        parentId: { type: string, nullable: true }
        archived: { type: boolean }
        archivedAt: { type: string, nullable: true, format: date-time }
    FeatureUpsertRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, nullable: true }
        color: { type: string, nullable: true }
        parentId: { type: string, nullable: true }
    FeatureTaskProgressRow:
      type: object
      required: [featureId, totalDirect, doneDirect, rolledUpTotal, rolledUpDone]
      properties:
        featureId: { type: string }
        totalDirect: { type: integer, format: int64 }
        doneDirect: { type: integer, format: int64 }
        rolledUpTotal: { type: integer, format: int64 }
        rolledUpDone: { type: integer, format: int64 }
    CategorySummary:
      type: object
      required: [id, name, color]
      properties:
        id: { type: string }
        name: { type: string }
        color: { type: string }
    ExceptionTaskTemplate:
      type: object
      properties:
        titleTemplate: { type: string }
        descriptionTemplate: { type: string }
        defaultCategoryId: { type: string, nullable: true }
        defaultCategory: { $ref: "#/components/schemas/CategorySummary", nullable: true }
        examplePlaceholderValues:
          type: object
          additionalProperties: { type: string }
          description: Sample values for configuration preview (not used when creating real tasks from exceptions).
    GameConfiguration:
      type: object
      properties:
        featureFlags:
          type: object
          additionalProperties: { type: boolean }
        settings:
          type: object
          additionalProperties: true
        exceptionTaskTemplate: { $ref: "#/components/schemas/ExceptionTaskTemplate" }
    ExceptionTaskTemplatePatch:
      type: object
      properties:
        titleTemplate: { type: string }
        descriptionTemplate: { type: string }
        defaultCategoryId: { type: string, nullable: true }
        examplePlaceholderValues:
          type: object
          additionalProperties: { type: string }
          description: Sample values for configuration preview. Omit on patch to keep existing examples.
    GameConfigurationPatchRequest:
      type: object
      description: Omitted top-level fields are left unchanged (partial update).
      properties:
        featureFlags:
          type: object
          additionalProperties: { type: boolean }
        settings:
          type: object
          additionalProperties: true
        exceptionTaskTemplate: { $ref: "#/components/schemas/ExceptionTaskTemplatePatch", nullable: true }
    Task:
      type: object
      description: |
        Task with nested feature, optional category, tags, and derived tagIds.
        When a task has one or more non-archived direct subtasks, its stored status is derived from those
        subtasks (minimum workflow status: PENDING, TODO, IN_PROGRESS, COMPLETED, DONE). Parent status is
        updated automatically when subtasks are created, updated, or deleted, and may be coerced on parent save.
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        feature: { $ref: "#/components/schemas/Feature" }
        featureId: { type: string }
        category: { $ref: "#/components/schemas/Category", nullable: true }
        categoryId: { type: string, nullable: true }
        tags:
          type: array
          items: { $ref: "#/components/schemas/Tag" }
        tagIds:
          type: array
          items: { type: string }
        parentTaskId: { type: string, nullable: true }
        sourceGameExceptionId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        archived: { type: boolean }
        archivedAt: { type: string, nullable: true, format: date-time }
        planningDocumentRefs:
          type: array
          description: Linked planning documents (markdown or excalidraw) for this task.
          items: { $ref: "#/components/schemas/TaskPlanningDocumentRef" }
    TaskPlanningDocumentRef:
      type: object
      properties:
        id: { type: string, description: Planning node id }
        name: { type: string }
        kind: { type: string, enum: [markdown, excalidraw] }
    TaskUpsertRequest:
      type: object
      required: [title, status, featureId]
      properties:
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string }
        featureId: { type: string }
        categoryId: { type: string, nullable: true }
        tagIds:
          type: array
          items: { type: string }
        parentTaskId: { type: string, nullable: true }
        sourceGameExceptionId: { type: string, nullable: true }
        planningNodeIds:
          type: array
          description: Planning node ids to attach (markdown or excalidraw only); replaces existing on update when sent.
          maxItems: 20
          items: { type: string }
    GameException:
      type: object
      properties:
        id: { type: string }
        errorMessage: { type: string, nullable: true }
        shortErrorMessage: { type: string, nullable: true }
        location: { type: string, nullable: true }
        map: { type: string, nullable: true }
        stackTrace: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        gamePlayerId: { type: string, nullable: true }
    GameExceptionPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/GameException" }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
    GameExceptionReportRequest:
      type: object
      properties:
        id: { type: string }
        errorMessage: { type: string, nullable: true }
        shortErrorMessage: { type: string, nullable: true }
        location: { type: string, nullable: true }
        map: { type: string, nullable: true }
        stackTrace: { type: string, nullable: true }
    GameExceptionIngestRequest:
      type: object
      properties:
        errorMessage: { type: string, nullable: true }
        shortErrorMessage: { type: string, nullable: true }
        location: { type: string, nullable: true }
        map: { type: string, nullable: true }
        stackTrace: { type: string, nullable: true }
    IntegrationPingRequest:
      type: object
      required: [validation]
      properties:
        validation:
          type: string
          enum: [ok]
    IntegrationStatusResponse:
      type: object
      properties:
        lastValidatedAt: { type: string, format: date-time, nullable: true }
    GameEventDefinition:
      type: object
      properties:
        id: { type: string }
        code: { type: string }
        displayName: { type: string, nullable: true }
        messageTemplate: { type: string }
        imageData: { type: string, nullable: true }
        color: { type: string }
        examplePlaceholderValues:
          type: object
          additionalProperties: { type: string }
          description: Uppercase placeholder token names (e.g. KEY, VALUE) to sample strings for UI preview; PLAYER_ID is never stored.
    GameEventDefinitionUpsertRequest:
      type: object
      required: [code, messageTemplate]
      properties:
        code: { type: string }
        displayName: { type: string, nullable: true }
        messageTemplate: { type: string }
        imageData: { type: string, nullable: true }
        color: { type: string, nullable: true }
        examplePlaceholderValues:
          type: object
          additionalProperties: { type: string }
    GameEvent:
      type: object
      properties:
        id: { type: string }
        definitionId: { type: string }
        definitionCode: { type: string }
        definitionColor: { type: string }
        playerId: { type: string, nullable: true }
        renderedMessage: { type: string }
        payload:
          type: object
          additionalProperties: { type: string }
        timestamp: { type: string, format: date-time }
    GameEventPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/GameEvent" }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        number: { type: integer }
        size: { type: integer }
    GameEventIngestRequest:
      type: object
      required: [definitionCode]
      properties:
        definitionCode: { type: string }
        parameters:
          type: object
          additionalProperties: { type: string }
    GameEventTrace:
      type: object
      properties:
        id: { type: string }
        location: { type: string, nullable: true }
        map: { type: string, nullable: true }
        playerId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        gameEventId: { type: string, nullable: true }
        renderedMessage: { type: string, nullable: true }
        definitionCode: { type: string, nullable: true }
        definitionColor: { type: string, nullable: true }
    GameEventTraceIngestRequest:
      type: object
      properties:
        location: { type: string }
        map: { type: string }
