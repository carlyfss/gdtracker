            schema: { $ref: "#/components/schemas/GameFeedbackIngestRequest" }
      responses:
        "201":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GameFeedback" }
        "400": { description: Validation error }
        "401": { description: Invalid token or player }
        "404": { description: Game not found }
  /api/games/{gameId}/game-feedback/{feedbackId}:
    get:
      tags: [GameFeedback]
      operationId: getGameFeedbackDetail
      parameters:
