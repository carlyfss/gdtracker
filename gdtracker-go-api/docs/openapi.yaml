      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationPingRequest"
      responses:
        "204": { description: No content }
        "400": { description: validation must be ok }
        "401": { description: Invalid token }
        "404": { description: Game not found }
