spring.application.name=gdtracker-api
server.port=${SERVER_PORT:8080}

gdtracker.cors.allowed-origins=${GDTRACKER_CORS_ALLOWED_ORIGINS:http://localhost:5173}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/numb_tracker}
spring.datasource.username=${DB_USERNAME:numb_tracker}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
