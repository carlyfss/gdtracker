                - name: code
                  in: query
                  required: false
                  schema:
                      type: string
                  description: Filter by definition code (case-insensitive exact match).
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 500
                  description: Page size (default 200, max 500).
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/GameEventResponse"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/game-events/search:
        get:
