openapi: 3.0.3
info:
    title: GDTracker API
    version: 1.0.0
    description: |
        REST API for GDTracker (Spring Boot 3). Data is scoped per **game** (tenant).

        **Session auth:** After `POST /auth/login` or `POST /auth/register`, the server issues a session cookie (`JSESSIONID`).
        Mutating requests to authenticated routes require **CSRF**: send header `X-XSRF-TOKEN` with the same value as the
        `XSRF-TOKEN` cookie (double-submit). The SPA typically primes CSRF with a GET before the first POST.

        **Bearer ingest endpoints (CSRF-exempt):** These routes use `Authorization: Bearer <ingest-token>` (per-game token
        from Configuration) and do NOT use the session cookie or CSRF token.

        - `POST /games/{gameId}/game-players` — **ingest token only**; registers a player session and returns a `playerId` (UUID).
        - `POST /games/{gameId}/game-events/ingest`, `POST /games/{gameId}/game-trace/ingest`,
          `POST /games/{gameId}/game-exceptions/ingest`, `POST /games/{gameId}/game-feedback/ingest` — require **both**
          the ingest token and header **`X-Player-Id`** (value from `game-players`).
        - `POST /games/{gameId}/integration` — **ingest token only**; body `{"validation":"ok"}`; no `X-Player-Id`.
          The dashboard can poll `GET /games/{gameId}/integration/status` (session) for the last successful ping time.

        Examples use placeholders only—never real passwords or tokens.
servers:
    - url: /api
      description: Relative to app origin (e.g. Vite proxy in dev).
tags:
    - name: Auth
      description: Register, login, logout, current user.
    - name: Games
      description: List and create games for the signed-in user.
    - name: GameExceptions
      description: Report and list runtime exceptions per game.
    - name: Trace
      description: Location heatmap traces (optional link to a game event).
    - name: Tasks
      description: Tasks CRUD (filtered list).
    - name: Features
      description: Product features per game.
    - name: Categories
      description: Task categories per game.
    - name: Tags
      description: Task tags per game (many-to-many with tasks).
    - name: Configuration
      description: Per-game feature flags and settings.
    - name: GameEvents
      description: Recorded game events (read) and ingest (write).
    - name: GameEventDefinitions
      description: Event type definitions (template, color, optional icon).
    - name: IngestToken
      description: Per-game ingest token status and regenerate.
    - name: GamePlayers
      description: Register per-session player ids for ingest correlation (Bearer ingest token).
    - name: GameFeedback
      description: In-game feedback (template meters, ingest, list for operators).
    - name: Integration
      description: Ingest token connectivity check from the game client; status for the operator dashboard.

security:
    - sessionCookie: []
      csrfHeader: []

paths:
    /auth/register:
        post:
            tags: [Auth]
            summary: Register a new user and establish a session
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AuthRegisterRequest"
                        examples:
                            sample:
                                value:
                                    username: "newplayer"
                                    password: "<choose-a-password>"
            responses:
                "201":
                    description: Created; session cookie set.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResponse"
                            examples:
                                sample:
                                    value:
                                        id: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                                        username: "newplayer"
                "400":
                    description: Validation error (Bean Validation).
                "409":
                    description: Username already exists.

    /auth/login:
        post:
            tags: [Auth]
            summary: Login and establish a session
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/AuthLoginRequest"
                        examples:
                            sample:
                                value:
                                    username: "legacy"
                                    password: "<password>"
            responses:
                "200":
                    description: OK; session cookie set.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResponse"
                "401":
                    description: Invalid credentials.

    /auth/logout:
        post:
            tags: [Auth]
            summary: Clear the current session (requires authentication)
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.

    /auth/me:
        get:
            tags: [Auth]
            summary: Current user (works without session—returns 401 if anonymous)
            security: []
            responses:
                "200":
                    description: Signed-in user.
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserResponse"
                            examples:
                                sample:
                                    value:
                                        id: "11111111-1111-1111-1111-111111111111"
                                        username: "legacy"
                "401":
                    description: Not authenticated (empty body).

    /games:
        get:
            tags: [Games]
            summary: List games owned by the current user
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/GameSummaryResponse"
                            examples:
                                sample:
                                    value:
                                        - id: "22222222-2222-2222-2222-222222222222"
                                          name: "Default game"
        post:
            tags: [Games]
            summary: Create a game
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CreateGameRequest"
                        examples:
                            sample:
                                value:
                                    name: "My new game"
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameSummaryResponse"
                "400":
                    description: Validation error.

    /games/{gameId}/game-exceptions:
        get:
            tags: [GameExceptions]
            summary: List exceptions for a game (newest first)
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/GameException"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
        post:
            tags: [GameExceptions]
            summary: Report an exception
            parameters:
                - $ref: "#/components/parameters/gameId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/GameExceptionCreateBody"
                        examples:
                            sample:
                                value:
                                    errorMessage: "NullPointerException"
                                    location: "Level1-3"
                                    map: "DungeonMap"
                                    stackTrace: "at com.example.Foo.bar(Foo.java:42)\n..."
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameException"
                "400":
                    description: Bad request.
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/game-exceptions/ingest:
        post:
            tags: [GameExceptions]
            summary: Report an exception from the game client (Bearer ingest + X-Player-Id)
            security:
                - bearerIngest: []
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/xPlayerId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/GameExceptionIngestRequest"
                        examples:
                            sample:
                                value:
                                    errorMessage: "NullPointerException"
                                    location: "Level1-3"
                                    map: "DungeonMap"
                                    stackTrace: "at com.example.Foo.bar(Foo.java:42)\n..."
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameException"
                "401":
                    description: Missing or invalid Bearer token, missing X-Player-Id, or invalid player id.
                "404":
                    description: Game not found.

    /games/{gameId}/game-exceptions/interval:
        get:
            tags: [GameExceptions]
            summary: List exceptions in a time window
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: fromMs
                  in: query
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: Interval start (epoch milliseconds).
                  example: 1710000000000
                - name: toMs
                  in: query
                  required: true
                  schema:
                      type: integer
                      format: int64
                  description: Interval end (epoch milliseconds), must be greater than fromMs.
                  example: 1710086400000
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/GameException"
                "400":
                    description: fromMs must be less than toMs.
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/game-exceptions/search:
        get:
            tags: [GameExceptions]
            summary: Paged text search across game exceptions
            description: |
                Case-insensitive substring match against `id`, `shortErrorMessage`, `errorMessage`,
                and `stackTrace`. Empty `q` returns the most recent exceptions, paginated.
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: q
                  in: query
                  required: false
                  schema:
                      type: string
                  description: Search text. Empty/blank means no text filter.
                  example: "com.example.Game.tick(Game.java:120)"
                - name: page
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 0
                      default: 0
                  description: Zero-based page index.
                - name: size
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 100
                      default: 10
                  description: Page size; clamped server-side to 1..100.
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameExceptionPage"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/game-exceptions/{exceptionId}:
        get:
            tags: [GameExceptions]
            summary: Get one game exception by id
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: exceptionId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameException"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game, exception not found, or not owned.

    /games/{gameId}/game-exceptions/{exceptionId}/reserve-task-index:
        post:
            tags: [GameExceptions]
            summary: Reserve next monotonic task index for this game
            description: |
                Per-game sequence for exception-linked task titles (e.g. EXCEPTION_INDEX).
                First call returns 1, then 2, etc. Abandoned reservations after a failed task create still consume the number.
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: exceptionId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ReserveExceptionTaskIndexResponse"
                            examples:
                                sample:
                                    value:
                                        index: 1
                "401":
                    description: Not authenticated.
                "404":
                    description: Game, exception not found, or not owned.

    /games/{gameId}/game-trace:
        get:
            tags: [Trace]
            summary: List heatmap trace points for a game (session)
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: playerId
                  in: query
                  required: false
                  schema:
                      type: string
                  description: Filter by player id (exact match).
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/GameEventTraceResponse"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/game-trace/ingest:
        post:
            tags: [Trace]
            summary: Add a heatmap trace (Bearer ingest token; CSRF not required)
            description: |
                Authenticated with the per-game ingest token (`Authorization: Bearer <ingest-token>`).
                Optionally links the trace to an existing `GameEvent` via `gameEventId`; the event must
                belong to the same game.
            security:
                - bearerIngest: []
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/xPlayerId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/GameEventTraceCreateRequest"
                        examples:
                            unlinked:
                                summary: Trace without event
                                value:
                                    location: "(35, 22, 17)"
                                    map: "proto-dungeon"
                            linked:
                                summary: Trace linked to an event
                                value:
                                    location: "(35, 22, 17)"
                                    map: "proto-dungeon"
                                    gameEventId: "bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb"
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameEventTraceResponse"
                "400":
                    description: Game event does not belong to this game.
                "401":
                    description: Missing or invalid Bearer token, missing X-Player-Id, or invalid player id.
                "404":
                    description: Game or game event not found.

    /games/{gameId}/game-players:
        post:
            tags: [GamePlayers]
            summary: Register a player session (Bearer ingest token only)
            description: Returns a new UUID to send as `X-Player-Id` on subsequent ingest calls.
            security:
                - bearerIngest: []
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GamePlayerRegisterResponse"
                            examples:
                                sample:
                                    value:
                                        playerId: "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
                "401":
                    description: Missing or invalid Bearer token.
                "404":
                    description: Game not found.

    /games/{gameId}/tasks:
        get:
            tags: [Tasks]
            summary: List tasks (optional filters)
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: featureId
                  in: query
                  required: false
                  schema:
                      type: string
                - name: status
                  in: query
                  required: false
                  schema:
                      $ref: "#/components/schemas/TaskStatus"
                - name: categoryId
                  in: query
                  required: false
                  schema:
                      type: string
                - name: tagIds
                  in: query
                  required: false
                  description: Repeatable; comma-separated values in one parameter are split. Omit to skip tag filtering.
                  schema:
                      type: array
                      items:
                          type: string
                  style: form
                  explode: true
                - name: tagMode
                  in: query
                  required: false
                  description: When multiple tagIds are provided — ANY (default) matches tasks with at least one tag; ALL matches tasks that have every listed tag.
                  schema:
                      type: string
                      enum: [ANY, ALL]
                      default: ANY
                - name: sourceGameExceptionId
                  in: query
                  required: false
                  description: When set, only tasks created from this game exception id are returned.
                  schema:
                      type: string
                - name: archivedOnly
                  in: query
                  required: false
                  description: |
                    When false (default), returns only tasks that are not archived and whose feature is not archived.
                    When true, returns tasks where the task is archived or its feature is archived.
                  schema:
                      type: boolean
                      default: false
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Task"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
        post:
            tags: [Tasks]
            summary: Create a task
            parameters:
                - $ref: "#/components/parameters/gameId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaskUpsertRequest"
                        examples:
                            sample:
                                value:
                                    title: "Fix spawn glitch"
                                    description: "Repro on map X"
                                    status: "TODO"
                                    featureId: "cccccccc-cccc-cccc-cccc-cccccccccccc"
                                    categoryId: null
                                    tagIds: []
                                    parentTaskId: null
                                    sourceGameExceptionId: null
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Task"
                "400":
                    description: Invalid featureId, categoryId, tagIds, or sourceGameExceptionId.
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/tasks/{id}:
        put:
            tags: [Tasks]
            summary: Update a task
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/TaskUpsertRequest"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Task"
                "400":
                    description: Invalid featureId, categoryId, tagIds, or sourceGameExceptionId.
                "401":
                    description: Not authenticated.
                "404":
                    description: Task or game not found.
        delete:
            tags: [Tasks]
            summary: Delete a task
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Task or game not found.

    /games/{gameId}/tasks/{id}/archive:
        post:
            tags: [Tasks]
            summary: Archive a task
            description: Marks the task archived. It no longer appears in default task lists.
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Task or game not found.

    /games/{gameId}/tasks/{id}/unarchive:
        post:
            tags: [Tasks]
            summary: Unarchive a task
            description: |
                Removes the archived marker from the task. If the task belongs to an archived feature, the backend may
                restore it under a restored-copy feature.
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Task or game not found.

    /games/{gameId}/features:
        get:
            tags: [Features]
            summary: List features for a game
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: archived
                  in: query
                  required: false
                  description: When false (default), only features that are not archived. When true, only archived features.
                  schema:
                      type: boolean
                      default: false
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Feature"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
        post:
            tags: [Features]
            summary: Create a feature
            parameters:
                - $ref: "#/components/parameters/gameId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/FeatureUpsertRequest"
                        examples:
                            sample:
                                value:
                                    name: "Combat"
                                    description: "Combat-related work"
                                    status: "TODO"
                                    color: "#22c55e"
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Feature"
                "400":
                    description: Invalid color format.
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
                "409":
                    description: Feature name already exists in the same parent.

    /games/{gameId}/features/task-progress:
        get:
            tags: [Features]
            summary: Per-feature task counts and rolled-up progress for a game
            parameters:
                - $ref: "#/components/parameters/gameId"
                - name: archived
                  in: query
                  required: false
                  description: |
                    When false (default), counts only non-archived tasks on non-archived features (dashboard).
                    When true, counts archived-visible tasks (task or feature archived) for archived features only.
                  schema:
                      type: boolean
                      default: false
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/FeatureTaskProgressRow"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/features/{id}:
        put:
            tags: [Features]
            summary: Update a feature
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/FeatureUpsertRequest"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Feature"
                "400":
                    description: Invalid color, parentId, or parent would create a cycle.
                "401":
                    description: Not authenticated.
                "404":
                    description: Feature not found.
                "409":
                    description: Name conflict in the same parent.
        delete:
            tags: [Features]
            summary: Delete a feature
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Feature not found.
                "409":
                    description: Feature has subfeatures or has tasks.

    /games/{gameId}/features/{id}/archive:
        post:
            tags: [Features]
            summary: Archive a feature and all its subfeatures
            description: Sets archived on the feature and every descendant feature in the hierarchy.
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Feature or game not found.

    /games/{gameId}/features/{id}/unarchive:
        post:
            tags: [Features]
            summary: Unarchive a feature and all its subfeatures
            description: Clears archived state for the feature and every descendant feature in the hierarchy.
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Feature or game not found.

    /games/{gameId}/categories:
        get:
            tags: [Categories]
            summary: List categories for a game
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Category"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
        post:
            tags: [Categories]
            summary: Create a category
            parameters:
                - $ref: "#/components/parameters/gameId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/CategoryUpsertRequest"
                        examples:
                            sample:
                                value:
                                    name: "Bugs"
                                    color: "#ef4444"
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Category"
                "400":
                    description: Invalid color format.
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
                "409":
                    description: Category name already exists.

    /games/{gameId}/tags:
        get:
            tags: [Tags]
            summary: List tags for a game
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/Tag"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
        post:
            tags: [Tags]
