            summary: List event definitions for a game
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: "#/components/schemas/GameEventDefinition"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
        post:
            tags: [GameEventDefinitions]
            summary: Create an event definition
            parameters:
                - $ref: "#/components/parameters/gameId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/GameEventDefinitionUpsertRequest"
                        examples:
                            sample:
                                value:
                                    code: "player_died"
                                    displayName: "Player death"
                                    messageTemplate: "Player <PLAYER_ID> died to <ENEMY> at <MAP>:<LOCATION>"
                                    imageData: null
                                    color: "#f97316"
            responses:
                "201":
                    description: Created
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameEventDefinition"
                "400":
                    description: Validation or image validation error.
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.
                "409":
                    description: Definition code already exists.

    /games/{gameId}/game-event-definitions/{id}:
        put:
            tags: [GameEventDefinitions]
            summary: Update an event definition
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/GameEventDefinitionUpsertRequest"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/GameEventDefinition"
                "400":
                    description: Validation error.
                "401":
                    description: Not authenticated.
                "404":
                    description: Definition not found.
                "409":
                    description: Code conflict.
        delete:
            tags: [GameEventDefinitions]
            summary: Delete an event definition
            parameters:
                - $ref: "#/components/parameters/gameId"
                - $ref: "#/components/parameters/resourceId"
            responses:
                "204":
                    description: No content.
                "401":
                    description: Not authenticated.
                "404":
                    description: Definition not found.
                "409":
                    description: Definition has recorded events.

    /games/{gameId}/ingest-token:
        get:
            tags: [IngestToken]
            summary: Whether an ingest token is configured and when it was created
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IngestTokenStatusResponse"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/ingest-token/regenerate:
        post:
            tags: [IngestToken]
            summary: Regenerate ingest token (plaintext returned once)
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IngestTokenRegenerateResponse"
                            examples:
                                sample:
                                    value:
                                        token: "<store-this-value-now-it-is-not-shown-again>"
                                        createdAt: "2026-05-03T16:45:00.000Z"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

    /games/{gameId}/integration:
        post:
            tags: [Integration]
            summary: Validate ingest token connectivity (Bearer only)
            description: |
                No `X-Player-Id` header. On success, stores a timestamp on the game for the operator UI
                (`GET .../integration/status`).
            security:
                - bearerIngest: []
            parameters:
                - $ref: "#/components/parameters/gameId"
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/IntegrationPingRequest"
                        examples:
                            ok:
                                value:
                                    validation: ok
            responses:
                "204":
                    description: Token valid; validation timestamp updated.
                "400":
                    description: Validation error (`validation` must be `ok`).
                "401":
                    description: Missing or invalid Bearer token, or ingest token not configured.
                "404":
                    description: Game not found.

    /games/{gameId}/integration/status:
        get:
            tags: [Integration]
            summary: Last integration ping time (session, game owner)
            parameters:
                - $ref: "#/components/parameters/gameId"
            responses:
                "200":
                    description: OK
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/IntegrationStatusResponse"
                            examples:
                                sample:
                                    value:
                                        lastValidatedAt: "2026-05-03T16:45:00.000Z"
                "401":
                    description: Not authenticated.
                "404":
                    description: Game not found or not owned.

components:
    securitySchemes:
        sessionCookie:
            type: apiKey
            in: cookie
            name: JSESSIONID
            description: Session established via login or register.
        csrfHeader:
            type: apiKey
            in: header
            name: X-XSRF-TOKEN
            description: Must match the `XSRF-TOKEN` cookie value for mutating requests (except login, register, ingest).
        bearerIngest:
            type: http
            scheme: bearer
            description: |
                Per-game ingest token (Configuration). Used for `POST .../game-players` (token only), for `POST .../integration`
                (token only), and for ingest routes that also require header `X-Player-Id`.

    parameters:
        xPlayerId:
            name: X-Player-Id
            in: header
            required: true
            schema:
                type: string
            description: Player id returned from `POST .../game-players` (required on all ingest routes except game-players).
        gameId:
            name: gameId
            in: path
            required: true
            schema:
                type: string
            example: "22222222-2222-2222-2222-222222222222"
        resourceId:
            name: id
            in: path
            required: true
            schema:
                type: string
            example: "eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee"

    schemas:
        AuthLoginRequest:
            type: object
            required: [username, password]
            properties:
                username:
                    type: string
                password:
                    type: string
        AuthRegisterRequest:
            type: object
            required: [username, password]
            properties:
                username:
                    type: string
                password:
                    type: string
        UserResponse:
            type: object
            properties:
                id:
                    type: string
                username:
                    type: string
        CreateGameRequest:
            type: object
            required: [name]
            properties:
                name:
                    type: string
        GameSummaryResponse:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
        ReserveExceptionTaskIndexResponse:
            type: object
            required: [index]
            properties:
                index:
                    type: integer
                    description: Value to use for EXCEPTION_INDEX in the task title template.
        GameException:
            type: object
            properties:
                id:
                    type: string
                errorMessage:
                    type: string
                    nullable: true
                shortErrorMessage:
                    type: string
                    nullable: true
                    description: Optional short label from the client (e.g. Unity) for lists and task templates.
                location:
                    type: string
                    nullable: true
                map:
                    type: string
                    nullable: true
                stackTrace:
                    type: string
                    nullable: true
                timestamp:
                    type: string
                    format: date-time
                gamePlayerId:
                    type: string
                    nullable: true
                    description: Set when the exception was reported via ingest with a player id.
        GameExceptionPage:
            type: object
            description: Spring `Page<GameException>` projection — only the fields the SPA consumes.
            required: [content, totalElements, totalPages, number, size]
            properties:
                content:
                    type: array
                    items:
                        $ref: "#/components/schemas/GameException"
                totalElements:
                    type: integer
                    format: int64
                    description: Total matching rows across all pages.
                totalPages:
                    type: integer
                    description: Total number of pages for the requested size.
                number:
                    type: integer
                    description: Zero-based page index for this response.
                size:
                    type: integer
                    description: Page size effectively used (server-clamped to 1..100).
        GameExceptionIngestRequest:
            type: object
            properties:
                errorMessage:
                    type: string
                    nullable: true
                shortErrorMessage:
                    type: string
                    nullable: true
                location:
                    type: string
                    nullable: true
                map:
                    type: string
                    nullable: true
                stackTrace:
                    type: string
                    nullable: true
        GameExceptionCreateBody:
            type: object
            properties:
                errorMessage:
                    type: string
                    nullable: true
                shortErrorMessage:
                    type: string
                    nullable: true
                location:
                    type: string
                    nullable: true
                map:
                    type: string
                    nullable: true
                stackTrace:
                    type: string
                    nullable: true
        GamePlayerRegisterResponse:
            type: object
            required: [playerId]
            properties:
                playerId:
                    type: string
                    format: uuid
        GameFeedback:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                description:
                    type: string
                playerId:
                    type: string
                meters:
                    type: object
                    additionalProperties:
                        type: integer
                        minimum: 1
                        maximum: 10
                createdAt:
                    type: string
                    format: date-time
        GameFeedbackIngestRequest:
            type: object
            required: [title, description]
            properties:
                title:
                    type: string
                    maxLength: 500
                description:
                    type: string
                    maxLength: 20000
                meters:
                    type: object
                    additionalProperties:
                        type: integer
                        minimum: 1
                        maximum: 10
                    description: |
                        Keys must match configured meter `fieldKey` values (case-insensitive). When template has meters,
                        every definition must receive a value. When template is empty, send `{}` or omit.
        GameFeedbackSummaryResponse:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                playerId:
                    type: string
                createdAt:
                    type: string
                    format: date-time
        GameFeedbackMeterValueResponse:
            type: object
            properties:
                fieldKey:
                    type: string
                question:
                    type: string
                value:
                    type: integer
                    minimum: 1
                    maximum: 10
        GameFeedbackDetailResponse:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                description:
                    type: string
                playerId:
                    type: string
                createdAt:
                    type: string
                    format: date-time
                meters:
                    type: array
                    items:
                        $ref: "#/components/schemas/GameFeedbackMeterValueResponse"
        GameFeedbackMeterDefinition:
            type: object
            properties:
                id:
                    type: string
                fieldKey:
                    type: string
                question:
                    type: string
                sortOrder:
                    type: integer
        GameFeedbackMeterDefinitionUpsertRequest:
            type: object
            required: [fieldKey, question]
            properties:
                fieldKey:
                    type: string
                    maxLength: 64
                question:
                    type: string
                    maxLength: 500
                sortOrder:
                    type: integer
        GameEventTraceCreateRequest:
            type: object
            properties:
                location:
                    type: string
                    nullable: true
                map:
                    type: string
                    nullable: true
                gameEventId:
                    type: string
                    nullable: true
        GameEventTraceResponse:
            type: object
            properties:
                id:
                    type: string
                location:
                    type: string
                    nullable: true
                map:
                    type: string
                    nullable: true
                playerId:
                    type: string
                    nullable: true
                timestamp:
                    type: string
                    format: date-time
                gameEventId:
                    type: string
                    nullable: true
                renderedMessage:
                    type: string
                    nullable: true
                definitionCode:
                    type: string
                    nullable: true
                definitionColor:
                    type: string
                    nullable: true
        TaskStatus:
            type: string
            enum: [PENDING, TODO, IN_PROGRESS, COMPLETED, DONE]
        TaskUpsertRequest:
            type: object
            required: [title, status, featureId]
            properties:
                title:
                    type: string
                description:
                    type: string
                    nullable: true
                status:
                    $ref: "#/components/schemas/TaskStatus"
                featureId:
                    type: string
                categoryId:
                    type: string
                    nullable: true
                tagIds:
                    type: array
                    items:
                        type: string
                    description: Tag ids for this task. Omit on PUT to leave associations unchanged; send [] to clear.
                parentTaskId:
                    type: string
                    nullable: true
                    description: Parent task id for subtasks; omit or null for root tasks
                sourceGameExceptionId:
                    type: string
                    nullable: true
                    description: |
                        Optional link to the game exception this task was created from.
                        On PUT, omit the property to leave the link unchanged; send null or "" to clear.
        Feature:
            type: object
            properties:
                id:
                    type: string
