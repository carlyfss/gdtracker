# Stack targets small boards (e.g. Raspberry Pi): build images on the device for correct ARM arch,
# or use `docker buildx build --platform linux/arm64` (64-bit Pi) / linux/arm/v7 (32-bit) from x86 CI.
services:
    postgres:
        image: postgres:14-alpine
        container_name: gdtracker-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: ${POSTGRES_USER:-gdtracker}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
            POSTGRES_DB: ${POSTGRES_DB:-gdtracker}
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 12
        networks:
            - gdtracker

    # gdtracker-go-api (not Spring). Listen port inside the container is PORT; host mapping uses SERVER_PORT.
    backend:
        build:
            context: ./gdtracker-go-api
            dockerfile: Dockerfile
        image: gdtracker-go-api:local
        container_name: gdtracker-go-api
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            PORT: ${SERVER_PORT:-8080}
            DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/gdtracker?sslmode=disable}
            DB_USERNAME: ${DB_USERNAME:-gdtracker}
            DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (see .env.example)}
            GDTRACKER_SESSION_SECRET: ${GDTRACKER_SESSION_SECRET:-dev-session-local-only}
            AUTH_MODE: ${AUTH_MODE:-session}
            AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
            AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
            GDTRACKER_CORS_ALLOWED_ORIGINS: ${GDTRACKER_CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-4173}}
            GDTRACKER_COOKIE_DOMAIN: ${GDTRACKER_COOKIE_DOMAIN:-}
            GDTRACKER_COOKIE_SECURE: ${GDTRACKER_COOKIE_SECURE:-false}
            # auto/on: run embedded golang-migrate Up on startup; off: skip (see gdtracker-go-api/docs/MIGRATIONS.md).
            GDTRACKER_GO_AUTO_MIGRATE: ${GDTRACKER_GO_AUTO_MIGRATE:-auto}
            GDTRACKER_GO_MIGRATE_FORCE_VERSION: ${GDTRACKER_GO_MIGRATE_FORCE_VERSION:-}
            GDTRACKER_ARCHIVE_RETENTION: ${GDTRACKER_ARCHIVE_RETENTION:-}
            GDTRACKER_ARCHIVE_RETENTION_TIMEZONE: ${GDTRACKER_ARCHIVE_RETENTION_TIMEZONE:-}
            GDTRACKER_ARCHIVE_RETENTION_HOUR: ${GDTRACKER_ARCHIVE_RETENTION_HOUR:-}
            GDTRACKER_ARCHIVE_RETENTION_MINUTE: ${GDTRACKER_ARCHIVE_RETENTION_MINUTE:-}
        ports:
            - "${SERVER_PORT:-8080}:${SERVER_PORT:-8080}"
        networks:
            - gdtracker

    # VITE_* build args are baked into the nginx image. After changing env, rebuild:
    #   docker compose build --no-cache frontend
    # Production: docs/DEPLOY_AUTH0.md and docker-compose.prod.yml
    frontend:
        build:
            context: ./gdtracker-web
            dockerfile: Dockerfile
            args:
                VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:${SERVER_PORT:-8080}}
                VITE_AUTH_MODE: ${VITE_AUTH_MODE:-session}
                VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
                VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
                VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
        image: gdtracker-web:local
        container_name: gdtracker-web
        restart: unless-stopped
        depends_on:
            - backend
        ports:
            - "${FRONTEND_PORT:-4173}:80"
        networks:
            - gdtracker

volumes:
    pgdata:
        name: gdtracker-pgdata

networks:
    gdtracker:
        name: gdtracker
